name: Build and test artifact server

on:
  push:
    branches: [feature/standalone-artifact-server]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test artifact package
        run: go test ./pkg/artifacts/...
      - name: Compile all packages
        run: go build ./...
      - name: Build Linux binary
        run: go build -v -o artifact-server-linux-amd64 ./cmd/artifact-server
      - name: Build macOS Intel binary
        env:
          GOOS: darwin
          GOARCH: amd64
        run: go build -v -o artifact-server-darwin-amd64 ./cmd/artifact-server
      - name: Build macOS Apple Silicon binary
        env:
          GOOS: darwin
          GOARCH: arm64
        run: go build -v -o artifact-server-darwin-arm64 ./cmd/artifact-server
      - name: Upload Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: artifact-server-linux-amd64
          path: artifact-server-linux-amd64
          if-no-files-found: error
      - name: Upload macOS Intel binary
        uses: actions/upload-artifact@v4
        with:
          name: artifact-server-darwin-amd64
          path: artifact-server-darwin-amd64
          if-no-files-found: error
      - name: Upload macOS Apple Silicon binary
        uses: actions/upload-artifact@v4
        with:
          name: artifact-server-darwin-arm64
          path: artifact-server-darwin-arm64
          if-no-files-found: error
