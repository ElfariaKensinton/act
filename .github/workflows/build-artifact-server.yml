name: Build and test artifact server

on:
  push:
    branches: [feature/standalone-artifact-server]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: go test ./...
      - name: Build artifact server
        run: go build -v ./cmd/artifact-server
