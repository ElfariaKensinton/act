name: Build and test artifact server

on:
  push:
    branches: [feature/standalone-artifact-server]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test artifact package
        run: go test ./pkg/artifacts/...
      - name: Compile all packages
        run: go build ./...
      - name: Build artifact server binary
        run: go build -v -o artifact-server ./cmd/artifact-server
